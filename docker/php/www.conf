[www]
user = www-data
group = www-data

; Dengarkan di semua interface agar bisa diakses dari container Nginx
listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Kirim log ke stderr Docker
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
